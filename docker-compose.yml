services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_HOST=0.0.0.0
      # Cloudflare Tunnel URLs (ganti dengan domain Anda)
      # Format: https://webhook.<DOMAIN>
      # Contoh: https://webhook.example.com
      - WEBHOOK_URL=https://webhook.REPLACE_ME_DOMAIN
      - N8N_CLOUDFLARE_URL=https://webhook.REPLACE_ME_DOMAIN
      # n8n Interface URL (opsional, untuk akses via Cloudflare)
      # Format: https://n8n.<DOMAIN>
      # Contoh: https://n8n.example.com
      - N8N_PROTOCOL=https
      - N8N_HOST=n8n.REPLACE_ME_DOMAIN
      - GENERIC_TIMEZONE=Asia/Jakarta
    volumes:
      - ./n8n_data:/home/node/.n8n
    restart: unless-stopped
    # Catatan: Cloudflare Tunnel harus berjalan di host (bukan di container)
    # Jalankan: cloudflared tunnel run --config ./cloudflare/tunnel-config.yaml <TUNNEL-NAME>
